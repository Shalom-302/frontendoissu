# Development overrides — this file IS `docker-compose.override.yml` on the
# `dev` branch, where `docker compose up` loads it automatically.
#
# Two conveniences that must NOT exist in staging or production:
#
#   1. Bind-mount the source so edits hot-reload WITHOUT rebuilding the image.
#      A named volume is mounted over /app/node_modules so the bind mount does
#      not hide the dependencies installed in the image (the Node equivalent of
#      the backend keeping its virtualenv at /opt/venv).
#   2. Build the `dev` stage, which runs `next dev` instead of the compiled
#      standalone server.
services:
  web:
    build:
      target: dev
    environment:
      - NODE_ENV=development
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://host.docker.internal:8000}
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
      # Build artefacts stay in the container: sharing .next with the host
      # mixes the container's Linux build with the host's and breaks both.
      - client_next_cache:/app/.next
    command: npm run dev

volumes:
  client_node_modules:
  client_next_cache:
