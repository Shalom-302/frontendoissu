# Staging overrides — this file IS `docker-compose.override.yml` on the
# `staging` branch.
#
# Same source, same image as production: staging exists to catch what differs
# between "it works on my machine" and a real deployment, so it runs the
# compiled standalone server pulled from GHCR, not a local dev build. What it
# changes is the network it lives on, the address of the API, the published port
# and the operational guard-rails.
services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/shalom-302/frontendoissu:staging}
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=${API_INTERNAL_URL:?API_INTERNAL_URL is required on staging}
    # `!override` replaces the base file's network list instead of appending to
    # it, so the container joins dokploy-network ONLY. Sharing that network with
    # the API container is what lets API_INTERNAL_URL use a service name.
    networks: !override
      - dokploy-network
    ports:
      - "${WEB_PORT:-3001}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  # Created and owned by Dokploy on the host (overlay, swarm scope). Declaring
  # it external means compose attaches to the existing network instead of
  # creating a second, isolated one with the same name.
  dokploy-network:
    external: true
