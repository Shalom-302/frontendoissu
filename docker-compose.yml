# Base stack — identical on every branch (dev / staging / main).
#
# It describes the PRODUCTION shape: the image is PULLED from the registry, not
# built here, and there is no source mount or hot reload.
# `docker-compose.dev.yml` is the only overlay that adds a `build:` section —
# which is what lets Dokploy deploy by pulling a tag instead of compiling on the
# server. Each branch ships its own `docker-compose.override.yml` (loaded
# automatically by `docker compose up`), so a merge between branches touches the
# override only.
services:
  web:
    # Published by .github/workflows/docker-publish.yml on every push.
    # Override with WEB_IMAGE to pin a tag or a commit.
    image: ${WEB_IMAGE:-ghcr.io/shalom-302/frontendoissu:main}
    container_name: ${WEB_CONTAINER_NAME:-oissu_client}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Where the Next.js server reaches the API. The browser never calls the
      # API directly (everything goes through /api/proxy), so this is the only
      # address that has to resolve — and it is read at runtime, not baked into
      # the build.
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://host.docker.internal:8000}
      - NODE_ENV=production
    extra_hosts:
      # Lets the container reach a backend running on the host (Docker Desktop
      # provides this name natively; on Linux the mapping below adds it).
      - "host.docker.internal:host-gateway"
    networks:
      - oissu

networks:
  oissu:
    driver: bridge
