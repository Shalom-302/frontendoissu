# OISSU CONNECT — frontend stack (main / production).
#
# SELF-CONTAINED ON PURPOSE. There is no docker-compose.override.yml: Dokploy
# deploys with an explicit `-f <compose path>`, and Docker Compose only
# auto-loads an override file when it discovers the files itself. An overlay
# would therefore be silently ignored in production — the stack would start with
# the wrong image on the wrong network and look healthy.
#
# So each branch carries its own complete file:
#   dev      local build of the `dev` stage, source bind-mounted, hot reload
#   staging  pulls :staging from GHCR, joins dokploy-network
#   main     pulls :main    from GHCR, joins dokploy-network, hardened
#
# What you read here is exactly what runs on this branch.
services:
  web:
    # Built and pushed by .github/workflows/docker-publish.yml on every push to
    # this branch. Pin a commit with WEB_IMAGE=...:sha-1a2b3c4 when you need to.
    image: ${WEB_IMAGE:-ghcr.io/shalom-302/frontendoissu:main}
    container_name: ${WEB_CONTAINER_NAME:-oissu_client}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Where the Next.js server reaches the API. The browser never calls the
      # API directly (everything goes through /api/proxy), so this is the only
      # address that has to resolve — and it is read at runtime, not baked into
      # the build, which is why the exact image validated on staging is the one
      # promoted to production.
      # Defaults to the API container on dokploy-network — the peer this file
      # already commits to by joining that network. Not a silent fallback: the
      # one thing worth refusing is a deployment quietly talking to localhost,
      # and this never can. Override it with the public URL if the API lives on
      # another host: API_INTERNAL_URL=https://oissu-api.kortex.sbs
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://oissu_api:8000}
      - NODE_ENV=production
    # The server writes nothing outside /tmp and the Next.js cache.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      # Shared with the API stack: that is how API_INTERNAL_URL can name the
      # API container (http://oissu_api:8000).
      - dokploy-network

networks:
  # Created and owned by Dokploy (overlay, swarm scope). `external` attaches to
  # the existing network instead of creating a second, isolated one.
  dokploy-network:
    external: true
