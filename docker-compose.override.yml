# Production overrides — this file IS `docker-compose.override.yml` on the
# `main` branch.
#
# It adds nothing convenient: no bind mount, no dev server, no published
# datastore. It only hardens what the base file already describes.
services:
  web:
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=${API_INTERNAL_URL:?API_INTERNAL_URL is required in production}
    # The container writes nothing outside /tmp and the Next.js cache, so the
    # filesystem is read-only and privilege escalation is refused outright.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
